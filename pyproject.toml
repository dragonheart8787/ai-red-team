[project]
name = "cyber-orch"
version = "0.3.0.dev0"
description = "Policy-Aware Multi-Agent Cybersecurity Orchestration Platform — MVP-Kernel"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "httpx>=0.28",
    "docker>=7.1",
    # D35: per-engagement CA generation and per-host leaf signing for the
    # egress proxy's TLS termination. The control plane signs; the proxy only
    # *loads* a pre-signed leaf through the stdlib ssl module, so this
    # dependency never enters the scratch proxy image (its build rejects any
    # non-stdlib import). Hand-rolling x509 with the openssl CLI is exactly the
    # kind of thing that goes subtly wrong, which is why a real x509 library
    # earns its place here.
    "cryptography>=44",
    # MVP-0: the live Policy Reviewer. The kernel itself never calls a model
    # -- this is needed only by agents/llm/.
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["control_plane", "agents", "tool_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:control_plane.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
