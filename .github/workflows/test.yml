name: test

# Runs on every branch, not just main. The security properties this suite
# asserts are worth knowing about while the branch is still being written,
# not after it merges.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # No password anywhere in this file. The container is ephemeral and
          # reachable only from this job, and trust auth means there is no
          # credential to hardcode. Role separation and RLS (§8.6) are
          # unaffected: they turn on role attributes and policies, not on how
          # the superuser authenticates.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refuse to run with the skip escape hatch enabled
        # tests/conftest.py fails rather than skips when PostgreSQL is
        # unreachable, and CYBERORCH_ALLOW_DB_SKIP is the one way to change
        # that. CI must never take it: a green run that skipped every RLS and
        # resolver test verifies nothing. Checked before anything else, so the
        # job cannot be quietly neutered by a repository or environment
        # variable.
        run: |
          if [ -n "${CYBERORCH_ALLOW_DB_SKIP:-}" ]; then
            echo "::error::CYBERORCH_ALLOW_DB_SKIP is set. CI must not skip database tests."
            exit 1
          fi
          echo "CYBERORCH_ALLOW_DB_SKIP is unset — database tests will run or fail."

      - name: Install PostgreSQL client, nmap, ncat and curl
        # Installed on the runner, not pulled as an image: the sandbox image is
        # built from the host's own installation (see below), and this
        # environment has no route to a registry either. curl joined the list at
        # D31, which added the web.get adapter.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client nmap ncat curl
          nmap --version | head -1
          ncat --version 2>&1 | head -1
          curl --version | head -1

      - name: Build the sandbox tool image
        # Without this the §8.3 isolation tests fail rather than skip, which is
        # the intended behaviour -- a green run that never started a container
        # has verified nothing about the last physical boundary.
        run: ./tool_gateway/images/build_nmap_image.sh

      - name: Build the web target image
        # D31's web.get tests fetch from a real HTTP server over a real socket.
        # Same reasoning as the line above: without the target they fail rather
        # than skip, because a web.get test that never made a request has shown
        # nothing about the new data path.
        run: ./tool_gateway/images/build_web_target_image.sh

      - name: Verify Docker can enforce the network boundary
        # Checked explicitly and early so a runner without usable Docker
        # networking reports that, rather than surfacing as a wall of
        # confusing test failures later.
        run: |
          docker version --format '{{.Server.Version}}'
          docker network create --internal --subnet 10.90.0.0/24 ci-boundary-check
          docker run --rm --network ci-boundary-check cyberorch/nmap:local \
            /usr/bin/ncat -w 2 -v 10.91.0.1 8080 2>&1 | tee /tmp/probe.log || true
          docker network rm ci-boundary-check
          grep -q "Network is unreachable" /tmp/probe.log || {
            echo "::error::the runner's Docker cannot enforce an internal network boundary"
            exit 1
          }
          echo "kernel refused egress outside the allowlist, as §8.3 requires"

      - name: Verify the web target serves over the boundary
        # The positive control for D31, checked here for the same reason the
        # negative one is: if the target cannot serve, every web.get test fails
        # in a way that looks like a confinement problem rather than a missing
        # server.
        run: |
          docker network create --internal --subnet 10.78.0.0/24 ci-web-check
          docker run -d --name ci-web-target --network ci-web-check --ip 10.78.0.10 \
            cyberorch/web-target:local
          sleep 3

          # Diagnostics first, unconditionally. The previous two failures of this
          # step were blind: it tore the container down before printing anything,
          # so a container that exited on startup and a container that served a
          # 404 produced the same output -- nothing. The dev container has no
          # Docker, so CI is the only place this can be observed at all.
          echo "--- container state ---"
          docker ps -a --filter name=ci-web-target \
            --format '{{.Status}} | {{.Image}} | {{.Command}}'
          echo "--- container stdout/stderr ---"
          docker logs ci-web-target 2>&1 | head -20 || true

          echo "--- fetch ---"
          docker run --rm --network ci-web-check cyberorch/nmap:local \
            /usr/bin/curl --silent --show-error --include --proto '=http' \
            --no-location --max-time 10 http://10.78.0.10:8080/index.html \
            > /tmp/web.log 2>&1 || true
          head -5 /tmp/web.log

          docker rm -f ci-web-target
          docker network rm ci-web-check
          grep -q "200 OK" /tmp/web.log || {
            echo "::error::the web target did not serve a 200 over the internal network"
            exit 1
          }
          echo "the web target served a real response inside the allowlist"

      - name: Install Python dependencies
        run: make setup PYTHON=python

      - name: Install OPA
        run: |
          curl -fsSL -o /usr/local/bin/opa \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version
        env:
          OPA_VERSION: 1.9.0

      - name: Policy tests
        # §11 makes `opa test` a CI gate: any Policy Pack change has to pass
        # before it can take effect. The adversarial fixtures live here, and
        # they are permanent -- what they assert is that the kernel's answer
        # does not depend on the AI being right, which no model version retires.
        run: opa test control_plane/policy/rego policy_tests -v

      - name: Policy formatting
        run: opa fmt --fail --list control_plane/policy/rego policy_tests

      - name: Wait for PostgreSQL
        # The service health check should already have settled this. Confirm it
        # explicitly so a connectivity problem fails here, with a clear message,
        # instead of surfacing later as a wall of test errors.
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then exit 0; fi
            sleep 2
          done
          echo "::error::PostgreSQL service never became ready."
          exit 1

      - name: Provision database, roles and migrations
        # The same script developers run. PGSUPER_MODE=tcp points it at the
        # service container instead of a local socket; everything else --
        # migration_owner/cyberorch_app separation, generated passwords, FORCE
        # ROW LEVEL SECURITY -- is identical, so CI exercises the real path
        # rather than one that merely resembles it.
        env:
          PGSUPER_MODE: tcp
          PGSUPER: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
        run: ./scripts/init_db.sh

      - name: Run test suite
        run: .venv/bin/pytest -v -ra --junitxml=junit.xml

      - name: Assert nothing was skipped
        # Belt and braces for the property the whole job exists to protect. A
        # skipped security test is not a passing security test, so any skip
        # fails the build even though pytest itself exits 0.
        if: always()
        run: |
          .venv/bin/python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("junit.xml").getroot()
          if suite.tag == "testsuites":
              suite = suite[0]
          counts = {k: int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
          print("tests={tests} failures={failures} errors={errors} skipped={skipped}".format(**counts))
          if counts["skipped"]:
              print("::error::%d test(s) skipped. CI requires every test to run."
                    % counts["skipped"])
              sys.exit(1)
          if counts["tests"] == 0:
              print("::error::No tests ran.")
              sys.exit(1)
          PY

      - name: Lint
        run: .venv/bin/ruff check .
