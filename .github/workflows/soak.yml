name: soak

# D66. The soak (docs/D66_SOAK.md) runs here because the development machine could not be kept up for
# four hours (three host interruptions in one day: ACCEPTANCE 5.112). Not part of `test`; it does not
# run on an ordinary push.
#
# How it is started:
# * `workflow_dispatch` -- `hours` (4 for a soak; 0.2 is a smoke run of this workflow, with the fault
#   interval cut to about a minute so that all six kinds are injected once).
#   GitHub only lists a workflow for dispatch once the file is on the default branch.
# * `push` of `.github/soak-request.json` to the development branch -- the same thing before the
#   file is on the default branch: the request names the hours.
# * `schedule` -- every Sunday at 02:17 UTC, 4 hours.
#
# What it enforces, none of it relaxed here:
# * the conductor runs as the unprivileged runner user; `sudo` is used for the restart of PostgreSQL and
#   for the restart of the Docker daemon, and (in the setup steps, before the run) to install and
#   configure; the conductor's own code asks for it in exactly those two places;
# * the database is read through a monitoring role (BYPASSRLS, pg_monitor, SELECT) -- not as a
#   superuser;
# * the runner is measured first and the soak's resource caps are derived from the measurement
#   (scripts/soak/measure.py) and printed as the caps of this environment;
# * the report lists how many times each check ran; zero is a failure;
# * the artifact and the summary are produced `if: always()`.

on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of traffic and faults (4 = a soak; 0.2 = a smoke run of the workflow)'
        default: '4'
        required: true
      p1_enforce:
        description: 'D68 S8a: run with task_relation_enforce published in the baseline (true/false)'
        default: 'false'
        required: false
      q1_enforce:
        description: 'D68 S8b: run with both switches published in an emergency overlay, a real validator and the Q1 stream (true/false)'
        default: 'false'
        required: false
  push:
    branches: ['claude/mvp-kernel-cybersecurity-platform-su841g']
    paths: ['.github/soak-request.json']

permissions:
  contents: read

jobs:
  deadline-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the deadline helper and compare it with SHA256SUMS
        run: ./tool_gateway/deadline/build.sh --check 2>&1 | tee /tmp/deadline-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: deadline-helper
          path: tool_gateway/deadline/bin/
          if-no-files-found: error

  soak:
    needs: deadline-helper
    runs-on: ubuntu-latest
    # four hours of traffic, up to 45 minutes of drain, setup and the report: inside the 6 h a job may run
    timeout-minutes: 345
    env:
      RUN_DIR: ${{ github.workspace }}/soak-run
    steps:
      - uses: actions/checkout@v4

      - name: How long, and whether this is a smoke run
        id: plan
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) H="${{ github.event.inputs.hours }}" ;;
            push) H="$(python3 -c 'import json;print(json.load(open(".github/soak-request.json"))["hours"])')" ;;
            *) H=4 ;;
          esac
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) P1="${{ github.event.inputs.p1_enforce }}" ;;
            push) P1="$(python3 -c 'import json;print(str(json.load(open(".github/soak-request.json")).get("p1_enforce", False)).lower())')" ;;
            *) P1=false ;;
          esac
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) Q1="${{ github.event.inputs.q1_enforce }}" ;;
            push) Q1="$(python3 -c 'import json;print(str(json.load(open(".github/soak-request.json")).get("q1_enforce", False)).lower())')" ;;
            *) Q1=false ;;
          esac
          P1FLAG=""
          if [ "$P1" = "true" ]; then P1FLAG="--p1-enforce"; fi
          Q1FLAG=""
          if [ "$Q1" = "true" ]; then
            # S8b: the switches in an emergency overlay (the reversible form, ACCEPTANCE 5.124), both on
            # as they would be after S8a, and the workload slowed so that a real validator is asked
            # about each proposal at a rate a subscription allows (~5/min instead of ~40/min)
            P1FLAG="--p1-enforce"
            Q1FLAG="--q1-enforce --enforce-via overlay --mean-gap 45"
          fi
          echo "p1=$P1FLAG" >> "$GITHUB_OUTPUT"
          echo "q1=$Q1FLAG" >> "$GITHUB_OUTPUT"
          SMOKE=""
          if python3 -c "import sys; sys.exit(0 if float('$H') <= 0.5 else 1)"; then SMOKE="--smoke"; fi
          echo "hours=$H" >> "$GITHUB_OUTPUT"
          echo "smoke=$SMOKE" >> "$GITHUB_OUTPUT"
          echo "hours=$H smoke='${SMOKE}' p1_enforce='${P1FLAG}' q1='${Q1FLAG}' event=$GITHUB_EVENT_NAME" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fetch the deadline helper built and verified by the previous job
        uses: actions/download-artifact@v4
        with:
          name: deadline-helper
          path: tool_gateway/deadline/bin

      - run: chmod 0755 tool_gateway/deadline/bin/cyberorch-deadline-linux-*

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: A local PostgreSQL (the soak restarts it), nmap, ncat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql postgresql-client nmap ncat curl
          sudo service postgresql start
          pg_isready

      - name: The Docker daemon, started by hand so that the soak can restart it
        # The `docker_restart` fault sends SIGTERM to dockerd, waits, and starts `dockerd` again. The
        # runner's own daemon is socket-activated by systemd, which would take the socket back, so
        # systemd's units are stopped and the daemon is started the way the fault starts it, with
        # the runner's group on the socket (daemon.json) so that the unprivileged conductor can
        # still use it after a restart.
        run: |
          sudo systemctl stop docker.service docker.socket containerd.service || true
          sudo rm -f /var/run/docker.sock
          sudo mkdir -p /etc/docker
          echo "{\"group\": \"$(id -gn)\"}" | sudo tee /etc/docker/daemon.json
          sudo touch /tmp/dockerd.log && sudo chmod 666 /tmp/dockerd.log
          (sudo setsid nohup dockerd >> /tmp/dockerd.log 2>&1 < /dev/null &)
          for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker version --format '{{.Server.Version}}'

      - name: Install the project and create the database
        run: |
          python -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -e '.[dev]'
          # init_db.sh reads db/roles.sql as the postgres user, which cannot enter the runner's home
          sudo chmod a+x "$HOME"
          sudo --preserve-env=PATH ./scripts/init_db.sh
          sudo chown "$(id -u):$(id -g)" .env && chmod 600 .env

      - name: The monitoring role the soak reads the database as
        # Not a superuser: it reads every row (BYPASSRLS), the server's activity (pg_monitor) and
        # the schema, and writes nothing.
        run: |
          PW="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$PW"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d cyberorch <<SQL
          CREATE ROLE soak_monitor LOGIN BYPASSRLS PASSWORD '$PW';
          GRANT pg_monitor TO soak_monitor;
          GRANT USAGE ON SCHEMA public TO soak_monitor;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO soak_monitor;
          SQL
          echo "SOAK_PSQL_URL=postgresql://soak_monitor:$PW@127.0.0.1:5432/cyberorch" >> "$GITHUB_ENV"
          sudo chmod -R a+rX /var/log/postgresql || true

      - name: OPA, the policy engine (without it every request is denied, and nothing is exercised)
        run: |
          sudo curl -fsSL -o /usr/local/bin/opa \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          sudo chmod +x /usr/local/bin/opa
          opa version
          opa test control_plane/policy/rego policy_tests | tail -1
        env:
          OPA_VERSION: 1.9.0

      - name: Build the images the soak's workload uses
        run: |
          docker pull python:3.12-slim
          ./tool_gateway/images/build_nmap_image.sh

      - name: Measure the runner, and derive the caps from the measurement
        run: |
          mkdir -p "$RUN_DIR"
          set -a; . ./.env; set +a
          .venv/bin/python -m scripts.soak.measure --dir "$RUN_DIR" | tee /tmp/caps.txt
          { echo '### The runner, measured'; echo '```json'; cat "$RUN_DIR/caps.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: S8b -- the claude CLI on the runner, at the version DP-14 was measured with (Q1 run)
        if: steps.plan.outputs.q1 != ''
        run: |
          sudo npm install -g @anthropic-ai/claude-code@2.1.307 2>&1 | tail -3
          claude --version

      - name: S8b -- the login is the repository secret CLAUDE_CODE_OAUTH_TOKEN, and nothing else (Q1 run)
        # The subscription path of D10/D10.5 and the S7 baseline. It is read from the secret by name and
        # never printed; ANTHROPIC_API_KEY (the pay-per-use path) must not be present, because the CLI
        # would prefer it. A missing secret stops the job here, in a second, with the name to set.
        if: steps.plan.outputs.q1 != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::the repository secret CLAUDE_CODE_OAUTH_TOKEN is not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is present in the environment; the Q1 run uses the subscription login only"
            exit 1
          fi
          echo "CLAUDE_CODE_OAUTH_TOKEN is set (value not shown); ANTHROPIC_API_KEY is absent"

      - name: S8b pre-flight -- the validator answers once (only in a Q1 run)
        # A Q1 soak whose validator cannot answer (no CLI on the runner, no login, a rate-limited
        # account) would run four hours to say so. One real call, before anything starts.
        if: steps.plan.outputs.q1 != ''
        env:
          CYBERORCH_PLANFIT_BACKEND: claude_code
          CYBERORCH_PLANFIT_MODEL: sonnet
          CLAUDE_CODE_DISABLE_REFUSAL_FALLBACK: '1'
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ''
        run: |
          set -a; . ./.env; set +a
          .venv/bin/python -m scripts.soak.q1_preflight

      - name: S8b diagnostic -- the corpus's matched group, one call after another, in this environment (Q1 run)
        # The Q1 smokes failed on about half of the soak's `network.scan` proposals here, every one a
        # safety-classifier stop, while the same validator on the development machine fails on
        # `network.scan` 0 of 16 matched items (S7, and again on 2026-10-24). The same 60 items,
        # sequentially, before the soak: this environment itself, or the soak's own inputs?
        if: steps.plan.outputs.q1 != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ''
        run: |
          set -a; . ./.env; set +a
          PYTHONPATH=. .venv/bin/python -m scripts.soak.q1_ci_matched --run \
            --record "$RUN_DIR/ci_matched.json" --out "$RUN_DIR/ci_matched.md" > "$RUN_DIR/ci_matched.log" 2>&1 || true
          tail -12 "$RUN_DIR/ci_matched.log"
          { echo '### S8b diagnostic: the matched group in CI, sequential'; cat "$RUN_DIR/ci_matched.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: The soak (unprivileged; sudo only for the two restarts)
        env:
          Q1: ${{ steps.plan.outputs.q1 }}
          # empty on a run without Q1 (a run before S8b never had it); the subscription login on a Q1 run
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.plan.outputs.q1 != '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_API_KEY: ''
        run: |
          set -a; . ./.env; set +a
          STREAM_PID=""
          if [ -n "$Q1" ]; then
            # S8b: a real validator for the soak's own proposals, and a stream of proposals of every
            # action class beside it (scripts/soak/q1_stream.py), for the failure rate by class
            export CYBERORCH_PLANFIT_BACKEND=claude_code
            # the configuration DP-14's numbers were measured with (D68_S7_FIXED_MODEL_REPORT)
            export CYBERORCH_PLANFIT_MODEL=sonnet CLAUDE_CODE_DISABLE_REFUSAL_FALLBACK=1
            .venv/bin/python -m scripts.soak.q1_stream --hours "${{ steps.plan.outputs.hours }}" \
              --per-hour 100 --out "$RUN_DIR/q1_stream.jsonl" > "$RUN_DIR/q1_stream.log" 2>&1 &
            STREAM_PID=$!
          fi
          set +e
          .venv/bin/python -m scripts.soak.conductor \
            --run-dir "$RUN_DIR" --caps-file "$RUN_DIR/caps.json" \
            --hours "${{ steps.plan.outputs.hours }}" ${{ steps.plan.outputs.smoke }} ${{ steps.plan.outputs.p1 }} ${{ steps.plan.outputs.q1 }}
          RC=$?
          if [ -n "$STREAM_PID" ]; then kill "$STREAM_PID" 2>/dev/null; wait "$STREAM_PID" 2>/dev/null; fi
          exit $RC

      - name: S8b -- the Q1 stream, by action class and by the wording of the goal
        if: always() && steps.plan.outputs.q1 != ''
        run: |
          set -a; . ./.env; set +a
          tail -5 "$RUN_DIR/q1_stream.log" 2>/dev/null || true
          .venv/bin/python -m scripts.soak.q1_report --stream "$RUN_DIR/q1_stream.jsonl" --out "$RUN_DIR/q1_report.md"
          { echo '### S8b: the Q1 stream'; cat "$RUN_DIR/q1_report.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: S8a -- the enablement checks, made to fire (only in a run with P1 enforcement)
        # A check that has only ever passed has shown nothing: this makes, in this database, each
        # state the checks are for (a switch that does not reach an engagement, a switch on with
        # nothing recorded, a validator switch on with no validator) and requires the verdict each
        # should get. It fails the job if any state is let through.
        if: always() && steps.plan.outputs.p1 != ''
        run: |
          set -a; . ./.env; set +a
          unset CYBERORCH_PLANFIT_BACKEND
          .venv/bin/python -m scripts.soak.negative_controls --out "$RUN_DIR/negative_controls.json" 2>&1 | tee "$RUN_DIR/negative_controls.log"
          { echo '### S8a: the enablement checks, made to fire'; echo '```'; cat "$RUN_DIR/negative_controls.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: What the heartbeat says about the run, and the logs of the daemons
        if: always()
        run: |
          .venv/bin/python -m scripts.soak.heartbeat "$RUN_DIR" || true
          cp /tmp/dockerd.log "$RUN_DIR/dockerd.log" 2>/dev/null || true
          sudo cp /var/log/postgresql/*.log "$RUN_DIR/" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$RUN_DIR" || true

      - name: What matters, printed to the log (the artifact is also uploaded)
        if: always()
        run: |
          echo "=== findings and stops"
          grep -E '"kind": "(FINDING|soak.stopping)"' "$RUN_DIR/events.jsonl" 2>/dev/null | cut -c1-900 || true
          echo "=== Q1 validator failures in the soak's own workload (reason, first 20)"
          grep -E '"kind": "worker.q1_failure"' "$RUN_DIR/events.jsonl" 2>/dev/null | cut -c1-500 | head -20 || true
          echo "=== service exits"
          grep -E '"kind": "service.exited"' "$RUN_DIR/events.jsonl" 2>/dev/null | cut -c1-300 || true
          echo "=== faults"
          grep -E '"kind": "fault\.(begin|applied|recovery)"' "$RUN_DIR/events.jsonl" 2>/dev/null | cut -c1-260 || true
          echo "=== smoke: checks not enforced"
          grep -E '"kind": "smoke.not_enforced"' "$RUN_DIR/events.jsonl" 2>/dev/null | cut -c1-300 | head -5 || true
          echo "=== report (head)"
          head -c 14000 "$RUN_DIR/report.md" 2>/dev/null || echo "no report.md"
          # D68 S1 follow-up: the head above ends inside the explained rows of the log classification, and the
          # artifact cannot be fetched from the development machine -- so the whole section is printed here,
          # and the Docker daemon's own log is counted by shape, to be read without the artifact.
          echo "=== logs, classified (the whole section, lines cut at 700 characters)"
          awk '/^## Logs, classified after the run/{f=1} f' "$RUN_DIR/report.md" 2>/dev/null | cut -c1-700 | head -c 40000 || true
          echo "=== dockerd.log by shape (ids and times removed), top 15"
          sed -E 's/time="[^"]*"//; s/[0-9a-f]{12,}/<id>/g' "$RUN_DIR/dockerd.log" 2>/dev/null | sort | uniq -c | sort -rn | head -15 | cut -c1-300 || true

      - name: Summary
        if: always()
        run: |
          if [ -f "$RUN_DIR/report.md" ]; then
            head -c 60000 "$RUN_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report.md: the run did not reach its end." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-run
          # the raw container evidence of the run is not uploaded; the report, the journal, the samples
          # and the logs are
          path: |
            ${{ github.workspace }}/soak-run
            !${{ github.workspace }}/soak-run/evidence
          retention-days: 30
          if-no-files-found: warn
