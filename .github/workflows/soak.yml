name: soak

# D66. The soak (docs/D66_SOAK.md) runs here because the development machine could not be kept up for
# four hours (three host interruptions in one day: ACCEPTANCE 5.112). Not part of `test`; it does not
# run on an ordinary push.
#
# How it is started:
# * `workflow_dispatch` -- `hours` (4 for a soak; 0.2 is a smoke run of this workflow, with the fault
#   interval cut to about a minute so that all six kinds are injected once).
#   GitHub only lists a workflow for dispatch once the file is on the default branch.
# * `push` of `.github/soak-request.json` to the development branch -- the same thing before the
#   file is on the default branch: the request names the hours.
# * `schedule` -- every Sunday at 02:17 UTC, 4 hours.
#
# What it enforces, none of it relaxed here:
# * the conductor runs as the unprivileged runner user; `sudo` is used for the restart of PostgreSQL and
#   for the restart of the Docker daemon, and (in the setup steps, before the run) to install and
#   configure; the conductor's own code asks for it in exactly those two places;
# * the database is read through a monitoring role (BYPASSRLS, pg_monitor, SELECT) -- not as a
#   superuser;
# * the runner is measured first and the soak's resource caps are derived from the measurement
#   (scripts/soak/measure.py) and printed as the caps of this environment;
# * the report lists how many times each check ran; zero is a failure;
# * the artifact and the summary are produced `if: always()`.

on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Hours of traffic and faults (4 = a soak; 0.2 = a smoke run of the workflow)'
        default: '4'
        required: true
  push:
    branches: ['claude/mvp-kernel-cybersecurity-platform-su841g']
    paths: ['.github/soak-request.json']

permissions:
  contents: read

jobs:
  deadline-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the deadline helper and compare it with SHA256SUMS
        run: ./tool_gateway/deadline/build.sh --check 2>&1 | tee /tmp/deadline-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: deadline-helper
          path: tool_gateway/deadline/bin/
          if-no-files-found: error

  soak:
    needs: deadline-helper
    runs-on: ubuntu-latest
    # four hours of traffic, up to 45 minutes of drain, setup and the report: inside the 6 h a job may run
    timeout-minutes: 345
    env:
      RUN_DIR: ${{ github.workspace }}/soak-run
    steps:
      - uses: actions/checkout@v4

      - name: How long, and whether this is a smoke run
        id: plan
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) H="${{ github.event.inputs.hours }}" ;;
            push) H="$(python3 -c 'import json;print(json.load(open(".github/soak-request.json"))["hours"])')" ;;
            *) H=4 ;;
          esac
          SMOKE=""
          if python3 -c "import sys; sys.exit(0 if float('$H') <= 0.5 else 1)"; then SMOKE="--smoke"; fi
          echo "hours=$H" >> "$GITHUB_OUTPUT"
          echo "smoke=$SMOKE" >> "$GITHUB_OUTPUT"
          echo "hours=$H smoke='${SMOKE}' event=$GITHUB_EVENT_NAME" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fetch the deadline helper built and verified by the previous job
        uses: actions/download-artifact@v4
        with:
          name: deadline-helper
          path: tool_gateway/deadline/bin

      - run: chmod 0755 tool_gateway/deadline/bin/cyberorch-deadline-linux-*

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: A local PostgreSQL (the soak restarts it), nmap, ncat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql postgresql-client nmap ncat curl
          sudo service postgresql start
          pg_isready

      - name: The Docker daemon, started by hand so that the soak can restart it
        # The `docker_restart` fault sends SIGTERM to dockerd, waits, and starts `dockerd` again. The
        # runner's own daemon is socket-activated by systemd, which would take the socket back, so
        # systemd's units are stopped and the daemon is started the way the fault starts it, with
        # the runner's group on the socket (daemon.json) so that the unprivileged conductor can
        # still use it after a restart.
        run: |
          sudo systemctl stop docker.service docker.socket containerd.service || true
          sudo rm -f /var/run/docker.sock
          sudo mkdir -p /etc/docker
          echo "{\"group\": \"$(id -gn)\"}" | sudo tee /etc/docker/daemon.json
          sudo touch /tmp/dockerd.log && sudo chmod 666 /tmp/dockerd.log
          (sudo setsid nohup dockerd >> /tmp/dockerd.log 2>&1 < /dev/null &)
          for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker version --format '{{.Server.Version}}'

      - name: Install the project and create the database
        run: |
          python -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -e '.[dev]'
          # init_db.sh reads db/roles.sql as the postgres user, which cannot enter the runner's home
          sudo chmod a+x "$HOME"
          sudo --preserve-env=PATH ./scripts/init_db.sh
          sudo chown "$(id -u):$(id -g)" .env && chmod 600 .env

      - name: The monitoring role the soak reads the database as
        # Not a superuser: it reads every row (BYPASSRLS), the server's activity (pg_monitor) and
        # the schema, and writes nothing.
        run: |
          PW="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$PW"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d cyberorch <<SQL
          CREATE ROLE soak_monitor LOGIN BYPASSRLS PASSWORD '$PW';
          GRANT pg_monitor TO soak_monitor;
          GRANT USAGE ON SCHEMA public TO soak_monitor;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO soak_monitor;
          SQL
          echo "SOAK_PSQL_URL=postgresql://soak_monitor:$PW@127.0.0.1:5432/cyberorch" >> "$GITHUB_ENV"
          sudo chmod -R a+rX /var/log/postgresql || true

      - name: Build the images the soak's workload uses
        run: |
          docker pull python:3.12-slim
          ./tool_gateway/images/build_nmap_image.sh

      - name: Measure the runner, and derive the caps from the measurement
        run: |
          mkdir -p "$RUN_DIR"
          set -a; . ./.env; set +a
          .venv/bin/python -m scripts.soak.measure --dir "$RUN_DIR" | tee /tmp/caps.txt
          { echo '### The runner, measured'; echo '```json'; cat "$RUN_DIR/caps.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: The soak (unprivileged; sudo only for the two restarts)
        run: |
          set -a; . ./.env; set +a
          .venv/bin/python -m scripts.soak.conductor \
            --run-dir "$RUN_DIR" --caps-file "$RUN_DIR/caps.json" \
            --hours "${{ steps.plan.outputs.hours }}" ${{ steps.plan.outputs.smoke }}

      - name: What the heartbeat says about the run, and the logs of the daemons
        if: always()
        run: |
          .venv/bin/python -m scripts.soak.heartbeat "$RUN_DIR" || true
          cp /tmp/dockerd.log "$RUN_DIR/dockerd.log" 2>/dev/null || true
          sudo cp /var/log/postgresql/*.log "$RUN_DIR/" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$RUN_DIR" || true

      - name: Summary
        if: always()
        run: |
          if [ -f "$RUN_DIR/report.md" ]; then
            head -c 60000 "$RUN_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report.md: the run did not reach its end." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-run
          # the raw container evidence of the run is not uploaded; the report, the journal, the samples
          # and the logs are
          path: |
            ${{ github.workspace }}/soak-run
            !${{ github.workspace }}/soak-run/evidence
          retention-days: 30
          if-no-files-found: warn
